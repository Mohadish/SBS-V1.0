<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>White Test</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#ffffff; font-family:Arial; }
  body {
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap:8px;
    padding:8px;
    box-sizing:border-box;
  }
  .cell { display:flex; align-items:center; justify-content:center; font-size:14px; color:#333; }

  /* Cell A: opaque solid white */
  .a { background:#ffffff; border:1px solid #ccc; }

  /* Cell B: rgba + backdrop-filter (the "voice-over recipe") */
  .b {
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid #ccc;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    border-radius:14px;
  }

  /* Cell C: opaque solid white WITH translate3d (3D layer) */
  .c {
    background:#ffffff;
    transform:translate3d(0,0,0);
    will-change:transform;
    border:1px solid #ccc;
  }

  /* Cell D: opaque solid white WITHOUT any tricks (control) */
  .d { background:#ffffff; border:1px solid #ccc; }
</style>
</head>
<body>
  <div class="cell a">A — solid #ffffff</div>
  <div class="cell b">B — rgba(0.92) + blur(6px) + box-shadow</div>
  <div class="cell c">C — solid #ffffff + translate3d</div>
  <div class="cell d">D — control (solid #ffffff)</div>
</body>
</html>
